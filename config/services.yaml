parameters:
    app.posts_upload_dir: '%kernel.project_dir%/public/uploads/posts'
    app.bad_words_list: '%env(csv:BAD_WORDS_LIST)%'
    app.site_name: 'Tabaani Connect'
    app.site_tagline: 'Réseau social — export officiel PDF'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\PostMediaUploadService:
        arguments:
            $uploadDir: '%app.posts_upload_dir%'
            $projectDir: '%kernel.project_dir%'

    App\Service\BadWordGuard:
        arguments:
            $badWords: '%app.bad_words_list%'

    App\Service\PdfExportService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $siteName: '%app.site_name%'
            $siteTagline: '%app.site_tagline%'

    App\Service\ChatPresenceService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\ChatWebSocketCommand:
        arguments:
            $chatWsHost: '%env(string:CHAT_WS_HOST)%'
            $chatWsPort: '%env(int:CHAT_WS_PORT)%'
