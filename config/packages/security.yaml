security:
    password_hashers:
        App\Entity\Utilisateur: 'auto'

    providers:
        utilisateur_provider:
            id: App\Security\UtilisateurProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: utilisateur_provider
            access_denied_handler: App\Security\AccessDeniedHandler
            custom_authenticators:
                - App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/signup, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/accueil, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/cart, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/mes-reservations, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/panier, roles: ROLE_ADMIN }
        - { path: ^/reservation, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/dashboard, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
